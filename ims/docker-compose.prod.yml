services:

  db:
    image: postgres:16
    container_name: ims-postgres-prod
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: ims-redis-prod
    restart: always

    command: redis-server --appendonly yes

    volumes:
      - redis_prod_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build: .
    container_name: ims-api-prod
    restart: always

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS}

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4


  celery:
    build: .
    container_name: ims-celery-prod
    restart: always

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS}

    command: >
      celery
      -A app.celery_app.celery_app
      worker
      --loglevel=info


  celery-beat:
    build: .
    container_name: ims-celery-beat-prod
    restart: always

    depends_on:
      redis:
        condition: service_healthy

    environment:
      REDIS_URL: ${REDIS_URL}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_STARTTLS: ${MAIL_STARTTLS}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS}

    command: >
      celery
      -A app.celery_app.celery_app
      beat
      --loglevel=info
  nginx:
    image: nginx:alpine
    container_name: ims-nginx-prod
    restart: always

    depends_on:
      - api

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro    


volumes:
  postgres_prod_data:
  redis_prod_data: